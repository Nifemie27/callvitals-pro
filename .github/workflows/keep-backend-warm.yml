name: Keep backend warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://callvitals-pro-backend.onrender.com/health)
          echo "Health check responded with HTTP $status"
          if [ "$status" != "200" ]; then
            exit 1
          fi
