server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Hashed build assets (immutable content, safe to cache forever).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse-proxy API calls to the backend service so the SPA can call a
    # same-origin relative path (/api/...) with no CORS configuration needed
    # in production, regardless of what host/port this container is exposed on.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path /api/auth /api/auth;
    }

    location /health {
        proxy_pass http://backend:4000/health;
    }

    # Client-side routing (React Router): unmatched paths fall through to
    # index.html so a direct request or refresh on e.g. /analytics doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
