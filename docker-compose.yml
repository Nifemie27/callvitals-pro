services:
  postgres:
    image: postgres:16-alpine
    container_name: callvitals-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-callvitals}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-callvitals_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-callvitals}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-callvitals}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: callvitals-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
    container_name: callvitals-migrate
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-callvitals}:${POSTGRES_PASSWORD:-callvitals_dev_password}@postgres:5432/${POSTGRES_DB:-callvitals}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: ./backend
    container_name: callvitals-seed
    command: ["npx", "prisma", "db", "seed"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-callvitals}:${POSTGRES_PASSWORD:-callvitals_dev_password}@postgres:5432/${POSTGRES_DB:-callvitals}?schema=public
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123!Change}
      SEED_ANALYST_PASSWORD: ${SEED_ANALYST_PASSWORD:-Analyst123!Change}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: callvitals-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-callvitals}:${POSTGRES_PASSWORD:-callvitals_dev_password}@postgres:5432/${POSTGRES_DB:-callvitals}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    container_name: callvitals-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
